name: CI

# Roda os testes do backend e o build do frontend em todo push/PR. Nao
# precisa de nenhum segredo: os testes do backend usam o fallback SQLite
# (DATABASE_URL vazio -- ver backend/app/core/config.py), sem tocar no
# Postgres real do projeto (Neon). O deploy em si (Railway/Vercel) fica a
# cargo da integracao nativa deles com o GitHub (auto-deploy ao conectar
# o repositorio no dashboard de cada um) -- ver README, secao "Deploy".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
