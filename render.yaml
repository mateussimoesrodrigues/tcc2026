# Blueprint do Render (https://render.com/docs/blueprint-spec) -- ao criar
# um servico via "New > Blueprint" apontando pra este repositorio, o
# Render le este arquivo e configura build/start/healthcheck sozinho.
# Variaveis marcadas com "sync: false" sao segredos: o Render pede pra
# preencher na hora (nunca ficam neste arquivo, que e commitado).
#
# A geracao de sugestoes roda so no clique em "Gerar sugestoes agora" --
# nao ha job por tempo gerando promocao sozinho. ENABLE_SCHEDULER controla
# apenas o job de limpeza (expirar promocoes vencidas e pedidos
# abandonados). O tier gratuito do Render "dorme" apos ~15min sem
# requisicoes, entao o job roda quando o processo estiver acordado.
services:
  - type: web
    name: precificacao-inteligente-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: DISPLAY_SYNC_INTERVALO_SEGUNDOS
        value: "300"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SIMULATION_API_KEY
        sync: false
