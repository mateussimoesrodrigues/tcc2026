<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Tema (claro/escuro) aplicado ANTES da primeira pintura, pra nao piscar
         claro e escurecer. Mesma regra de src/tema.ts: escolha salva, senao
         o tema do sistema. Em try/catch porque o storage pode estar bloqueado. -->
    <script>
      try {
        var t = localStorage.getItem("tema");
        if (t !== "claro" && t !== "escuro") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        }
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <!-- Favicons da marca (arquivos em public/). O .ico com sizes="any" cobre
         navegador antigo; o SVG e o preferido nos modernos; os PNGs de 16/32
         cobrem quem nao usa SVG; o de 180 e o icone de "adicionar a tela de
         inicio" do iOS. Os icones da PWA (192/512) ficam no manifest, em
         vite.config.ts. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="Precix.AI: precificação inteligente para varejo físico." />
    <!-- IBM Plex Sans na interface + IBM Plex Mono em numero, codigo e
         rotulo tecnico. A Inter e so da tela de login (ver .login-split no
         App.css). display=swap: se a rede cair ou o app estiver
         offline (PWA), o texto aparece na hora com a fonte de sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Precix.AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
